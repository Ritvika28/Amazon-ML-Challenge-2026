# Configuration for Amazon ML Challenge 2026

project_name: "Amazon-ML-Challenge-2026"
random_seed: 42

data_paths:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  source_1: "TO_BE_SET_AFTER_EDA"
  source_2: "TO_BE_SET_AFTER_EDA"
  source_3: "TO_BE_SET_AFTER_EDA"
  ground_truth: "TO_BE_SET_AFTER_EDA"

output_paths:
  predictions_dir: "outputs/predictions"
  candidates_dir: "outputs/candidates"
  validation_dir: "outputs/validation"
  candidate_pairs_file: "outputs/candidates/candidate_pairs.tsv"
  matching_results_file: "outputs/predictions/matching_results.tsv"

model_paths:
  models_dir: "models"
  trained_model_file: "models/match_classifier.pkl"

blocking:
  strategies: []
  max_candidates_per_entity: null

features:
  name_similarity_metrics: []
  address_similarity_metrics: []
  use_location_features: false

training:
  model_type: "xgboost"
  test_size: 0.2
  hard_negative_ratio: 5.0
  hyperparameters: {}

threshold:
  target_metric: "macro_f0.5"
  default_threshold: 0.5
  search_range:
    min: 0.1
    max: 0.9
    step: 0.01

evaluation:
  beta: 0.5
  save_error_analysis: true
